# Build y deploy a PRODUCCIÓN del App Service verificacionlectores (RG GeneralApps).
# Un solo job, sin artifacts (no consume storage de Actions). Corre lint y
# tests antes de deployar: si fallan, no se deploya.
#
# Antes del primer deploy: App Service con Basic auth On (hasta migrar a OIDC),
# Startup Command = npm start, y el publish profile cargado en
# GitHub → Settings → Secrets → AZUREAPPSERVICE_PUBLISHPROFILE_VERIFICACIONLECTORES.

name: Deploy PROD - verificacionlectores

on:
  push:
    branches: [main]
  workflow_dispatch:

# Sin esto, dos pushes seguidos deployan a la vez y saltan con 409 (OneDeploy Conflict).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PUBLISH_PROFILE: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_VERIFICACIONLECTORES }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Instalar backend
        run: npm ci

      - name: Lint y tests
        run: |
          npm run lint --if-present
          npm test --if-present

      - name: Build frontend
        run: |
          cd client
          npm ci
          npm run build

      # Al App Service va solo lo que el servidor necesita: sus dependencias de
      # producción y client/dist. client/node_modules puede ser enorme (MUI,
      # jspdf, xlsx: cientos de MB y 100.000 archivos) y mandarlo hace que el
      # deploy tarde 40 minutos en vez de 4.
      - name: Podar lo que no va al servidor
        run: |
          npm prune --omit=dev
          rm -rf client/node_modules

      # `if: env.PUBLISH_PROFILE != ''` NO sirve como guard: evalúa vacío aunque
      # el secret esté cargado, el deploy se saltea y el job igual queda en
      # verde. Hay que decidirlo en un step que escriba a GITHUB_OUTPUT.
      # Loguea el largo, nunca el valor.
      - name: ¿Hay publish profile?
        id: pp
        run: |
          if [ -n "$PUBLISH_PROFILE" ]; then
            echo "hay=true" >> "$GITHUB_OUTPUT"
            echo "Publish profile presente (${#PUBLISH_PROFILE} caracteres)."
          else
            echo "hay=false" >> "$GITHUB_OUTPUT"
            echo "Publish profile ausente."
          fi

      - name: Deploy a Azure Web App
        if: steps.pp.outputs.hay == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'verificacionlectores'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ env.PUBLISH_PROFILE }}

      # Sin secret no se deploya, y el job FALLA: un "omitido" en verde ya nos
      # hizo creer que había deployado cuando no.
      - name: Falta el publish profile
        if: steps.pp.outputs.hay != 'true'
        run: |
          echo "::error::Falta el secret AZUREAPPSERVICE_PUBLISHPROFILE_VERIFICACIONLECTORES. El build pasó, pero NO se deployó."
          exit 1
