# Build y deploy al ambiente de TEST. HOY NO EXISTE: no hay App Service -test ni base
# controletiquetas-test, y el repo no tiene rama develop. Queda como molde.
# El App Service se llama verificacionlectores-test y vive en el mismo plan que producción.

name: Deploy TEST - verificacionlectores

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PUBLISH_PROFILE: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_VERIFICACIONLECTORES_TEST }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Instalar backend
        run: npm ci

      - name: Lint y tests
        run: |
          npm run lint --if-present
          npm test --if-present

      - name: Build frontend
        run: |
          cd client
          npm ci
          npm run build

      - name: Podar lo que no va al servidor
        run: |
          npm prune --omit=dev
          rm -rf client/node_modules

      # Ver el comentario de prod.yml: `if: env.PUBLISH_PROFILE != ''` evalúa
      # vacío aunque el secret esté cargado. Se decide con GITHUB_OUTPUT.
      - name: ¿Hay publish profile?
        id: pp
        run: |
          if [ -n "$PUBLISH_PROFILE" ]; then
            echo "hay=true" >> "$GITHUB_OUTPUT"
            echo "Publish profile presente (${#PUBLISH_PROFILE} caracteres)."
          else
            echo "hay=false" >> "$GITHUB_OUTPUT"
            echo "Publish profile ausente."
          fi

      - name: Deploy a Azure Web App (TEST)
        if: steps.pp.outputs.hay == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'verificacionlectores-test'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ env.PUBLISH_PROFILE }}

      # Hoy NO existe ambiente de test (ni App Service -test ni base
      # controletiquetas-test), así que acá el skip es esperado y no falla.
      # En prod.yml el mismo caso sí falla: ahí un "omitido" en verde engaña.
      - name: Deploy omitido (sin publish profile)
        if: steps.pp.outputs.hay != 'true'
        run: echo "::notice::Deploy omitido — no hay ambiente de test. El build pasó OK."
